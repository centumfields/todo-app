<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#3b6fd4">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="할 일">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="storage-warning" class="storage-warning" role="alert" hidden>저장할 수 없어 새로 고침하면 데이터가 사라집니다</div>
  <main class="app">
    <header class="header">
      <h1>할 일</h1>
      <p id="today-label" class="today-label"></p>
    </header>

    <!-- 오늘의 격언 -->
    <section class="quote" aria-label="오늘의 격언">
      <p class="quote-line"><span id="quote-text" class="quote-text"></span><small id="quote-author" class="quote-author"></small></p>
      <button type="button" id="quote-next" class="btn-secondary quote-next" aria-label="다른 격언 보기">다른 격언</button>
    </section>

    <!-- 진행률 영역 -->
    <section id="progress" class="progress" aria-label="진행률">
      <p class="progress-today-text"><span class="progress-label">오늘</span> <strong id="today-progress-text"></strong></p>
      <div id="today-bar" class="bar" role="progressbar" aria-label="오늘 진행률" aria-valuemin="0" aria-valuemax="100">
        <div id="today-bar-fill" class="bar-fill"></div>
      </div>
      <p id="all-done-msg" class="all-done-msg" hidden>오늘 할 일을 모두 끝냈어요</p>
      <p class="progress-all-text"><span class="progress-label">전체</span> <span id="all-progress-text"></span></p>
      <p id="category-progress" class="category-progress"></p>
    </section>

    <!-- 필터 탭 + 카테고리 관리 -->
    <div class="filter-row">
      <nav id="filter-tabs" class="filter-tabs" aria-label="카테고리 필터"></nav>
      <button type="button" id="cat-manage-btn" class="btn-secondary" aria-expanded="false" aria-controls="cat-panel">카테고리 관리</button>
    </div>

    <section id="cat-panel" class="cat-panel" aria-label="카테고리 관리" hidden>
      <form id="cat-form" class="cat-form">
        <input id="cat-input" type="text" maxlength="10" placeholder="새 카테고리 이름 (최대 10자)" aria-label="새 카테고리 이름" autocomplete="off">
        <button type="submit" class="btn-add">추가</button>
      </form>
      <p id="cat-msg" class="cat-msg" role="status" aria-live="polite"></p>
      <ul id="cat-list" class="cat-list"></ul>
    </section>

    <!-- 입력 영역 -->
    <form id="add-form" class="add-form">
      <input id="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" aria-label="할 일 입력" autocomplete="off">
      <select id="category-select" aria-label="카테고리"></select>
      <label class="plan-today">
        <input id="plan-today" type="checkbox" checked>
        오늘 할 일에 넣기
      </label>
      <button type="submit" class="btn-add">추가</button>
    </form>

    <section class="list-section" aria-labelledby="today-title">
      <h2 id="today-title">오늘 할 일 <span id="today-count" class="count"></span></h2>
      <ul id="today-list" class="todo-list"></ul>
    </section>

    <section class="list-section" aria-labelledby="all-title">
      <h2 id="all-title">전체 목록</h2>
      <ul id="all-list" class="todo-list"></ul>
    </section>

    <footer class="footer">
      <button type="button" id="clear-done" class="btn-danger">완료 항목 정리</button>
      <button type="button" id="export-btn" class="btn-secondary">내보내기</button>
      <button type="button" id="import-btn" class="btn-secondary">가져오기</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </footer>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
